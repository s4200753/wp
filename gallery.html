<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookVerse | Gallery</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Elms+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="site-header">
    <nav class="navbar navbar-expand-lg navbar-dark container py-2">
      <a class="navbar-brand brand" href="index.html">
        <span class="material-icons" aria-hidden="true">auto_stories</span>
        BookVerse
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="mainNav">
        <ul class="navbar-nav gap-lg-3">
          <li class="nav-item"><a class="nav-link" href="index.html"><span class="material-icons">home</span>Home</a></li>
          <li class="nav-item"><a class="nav-link" href="books.html"><span class="material-icons">menu</span>Browse Books</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="gallery.html"><span class="material-icons">photo_library</span>Gallery</a></li>
          <li class="nav-item"><a class="nav-link" href="add.html"><span class="material-icons">add_circle</span>Add Book</a></li>
        </ul>
      </div>
    </nav>
  </header>
  <div class="gradient-rule"></div>

  <main class="container py-5">
    <h1 class="section-title"><span class="material-icons">photo_library</span>Book Cover Gallery</h1>

    <div class="gallery-grid">
      <img src="assets/images/covers/1.png" alt="The Midnight Library" data-gallery-img data-title="The Midnight Library by Matt Haig">
      <img src="assets/images/covers/2.png" alt="Project Hail Mary" data-gallery-img data-title="Project Hail Mary by Andy Weir">
      <img src="assets/images/covers/3.png" alt="Dune" data-gallery-img data-title="Dune by Frank Herbert">
      <img src="assets/images/covers/4.png" alt="The Hobbit" data-gallery-img data-title="The Hobbit by J.R.R. Tolkien">
      <img src="assets/images/covers/5.png" alt="1984" data-gallery-img data-title="1984 by George Orwell">
      <img src="assets/images/covers/6.png" alt="Pride and Prejudice" data-gallery-img data-title="Pride and Prejudice by Jane Austen">
      <img src="assets/images/covers/7.png" alt="To Kill a Mockingbird" data-gallery-img data-title="To Kill a Mockingbird by Harper Lee">
      <img src="assets/images/covers/8.png" alt="The Great Gatsby" data-gallery-img data-title="The Great Gatsby by F. Scott Fitzgerald">
      <img src="assets/images/covers/9.png" alt="Educated" data-gallery-img data-title="Educated by Tara Westover">
      <img src="assets/images/covers/10.png" alt="The Seven Husbands of Evelyn Hugo" data-gallery-img data-title="The Seven Husbands of Evelyn Hugo by Taylor Jenkins Reid">
      <img src="assets/images/covers/11.png" alt="Atomic Habits" data-gallery-img data-title="Atomic Habits by James Clear">
      <img src="assets/images/covers/12.png" alt="Sapiens" data-gallery-img data-title="Sapiens by Yuval Noah Harari">
    </div>
  </main>

  <!-- Shared modal -->
  <div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="imageModalLabel">Book cover</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center">
          <img id="imageModalImg" src="" alt="" class="img-fluid rounded">
        </div>
        <div class="modal-footer justify-content-between">
          <button type="button" class="btn btn-secondary" id="modalPrevBtn">&lsaquo; Previous</button>
          <button type="button" class="btn btn-brand" id="modalNextBtn">Next &rsaquo;</button>
        </div>
      </div>
    </div>
  </div>

  <div class="gradient-rule"></div>
  <footer class="site-footer">
    <p class="mb-0">&copy; 2026 Arielle Dolan (s4200753). Your Gateway to Books.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/scripts.js"></script>
</body>
</html>
